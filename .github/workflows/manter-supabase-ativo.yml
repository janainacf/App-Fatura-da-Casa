# Fatura da Casa — mantém o Supabase acordado.
# O plano gratuito pausa o projeto quando o banco fica uma semana sem uso.
# Duas vezes por dia, o GitHub chama a função manter_ativo, que lê e grava no
# banco. Se falhar (projeto pausado ou fora do ar), o GitHub manda e-mail.
name: Manter Supabase ativo

on:
  schedule:
    - cron: '17 11 * * *'   # 8h17 em Brasília
    - cron: '47 22 * * *'   # 19h47 em Brasília
  workflow_dispatch:         # botão "Run workflow", para testar na hora

jobs:
  consulta:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Batimento no banco
        run: |
          curl -fsS --retry 5 --retry-delay 30 --retry-all-errors \
            -X POST "https://iafbaizkbeuscbjbctms.supabase.co/rest/v1/rpc/manter_ativo" \
            -H "apikey: sb_publishable_KEYqm5sTMEluXqmIVJrCfQ_iyPbCxy4" \
            -H "Content-Type: application/json" \
            -d '{}'
          echo
          echo "Supabase respondeu e registrou o batimento."
